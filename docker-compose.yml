services:
  postgres:
    image: postgres:16-alpine
    container_name: nexis_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexis_user
      POSTGRES_PASSWORD: nexis_password
      POSTGRES_DB: nexis_hub
    ports:
      - "5432:5432"
    volumes:
      - nexis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexis_user -d nexis_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexis_hub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexis_postgres_data:
  nexis_redis_data:
