# Apps natives iOS (SwiftUI) et Android (Jetpack Compose) : compilation,
# tests, puis captures des écrans principaux sur simulateur et émulateur.
# Les captures sont jointes à l'exécution (artefacts « captures-ios » et
# « captures-android ») pour les comparer aux maquettes validées.
name: Apps natives

on:
  push:
    paths:
      - "app_ios/**"
      - "app_android/**"
      - "app_mobile/lib/l10n/*.arb"
      - "outils/textes_apps_natives.py"
      - ".github/workflows/apps-natives.yml"
  pull_request:
    paths:
      - "app_ios/**"
      - "app_android/**"
      - "app_mobile/lib/l10n/*.arb"
      - "outils/textes_apps_natives.py"
      - ".github/workflows/apps-natives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-natives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  textes:
    name: Textes à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Les textes des apps natives suivent les fichiers .arb
        run: |
          python outils/textes_apps_natives.py
          git diff --exit-code -- app_ios/NexisHub/Resources/textes.json app_android/app/src/main/assets/textes.json

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app_ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Générer le projet
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Choisir un simulateur iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
              phones = phones or [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Compiler et tester
        run: |
          set -o pipefail
          xcodebuild test -project NexisHub.xcodeproj -scheme NexisHub \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -80
      - name: Captures d'écran
        run: |
          mkdir -p captures
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          APP=$(find build/Build/Products -name "NexisHub.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          shoot() { # nom, apparence, langue
            xcrun simctl ui "$UDID" appearance "$2"
            xcrun simctl terminate "$UDID" com.nexishub.app || true
            xcrun simctl launch "$UDID" com.nexishub.app -capture "$1" -language "$3"
            sleep 6
            xcrun simctl io "$UDID" screenshot "captures/ios-$1-$2-$3.png"
          }
          for screen in welcome phone signup home missions wallet profile services; do
            shoot "$screen" light fr
          done
          shoot home dark fr
          shoot home light ln
          shoot welcome light en
      - name: Captures dans le journal
        if: always()
        run: |
          # Copie lisible depuis le journal quand les artefacts ne sont pas accessibles.
          for f in captures/*.png; do
            [ -e "$f" ] || continue
            sips -s format jpeg -s formatOptions 70 -Z 1100 "$f" --out "${f%.png}.jpg" > /dev/null
            echo "@@CAPTURE $(basename "${f%.png}").jpg"; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "@@FIN"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-ios
          path: app_ios/captures
          if-no-files-found: warn

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler et tester
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-android
          path: |
            app_android/app/build/reports
          if-no-files-found: ignore
      - name: Activer KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Captures d'écran
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: app_android
          script: bash ../.github/scripts/captures-android.sh
      - name: Captures dans le journal
        if: always()
        run: |
          # Copie lisible depuis le journal quand les artefacts ne sont pas accessibles.
          pip install --quiet pillow
          for f in captures/*.png; do
            [ -e "$f" ] || continue
            python3 -c "import sys; from PIL import Image; im=Image.open(sys.argv[1]).convert('RGB'); im.thumbnail((1100,1100)); im.save(sys.argv[2], quality=70)" "$f" "${f%.png}.jpg"
            echo "@@CAPTURE $(basename "${f%.png}").jpg"; base64 -w0 "${f%.png}.jpg"; echo; echo "@@FIN"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-android
          path: app_android/captures
          if-no-files-found: warn
