name: PostgreSQL migration trial (synthetic data)

on:
  push:
    branches:
      - develop/nexis-unification
    paths:
      - '.github/workflows/postgres-trial.yml'
      - 'scripts/postgres_trial.py'
      - 'scripts/preflight_postgres.py'
      - 'db.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexis_test
          POSTGRES_PASSWORD: temporary_ci_password
          POSTGRES_DB: nexis_trial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexis_test -d nexis_trial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXIS_MIGRATION_PG_DSN: postgresql://nexis_test:temporary_ci_password@127.0.0.1:5432/nexis_trial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trial dependencies
        run: python -m pip install -r requirements-migration.txt
      - name: Create disposable synthetic SQLite backup
        run: |
          python - <<'PY'
          import db
          from pathlib import Path
          db.DB_PATH = Path("backups/nexis-trial-synthetic.db")
          db.DB_PATH.parent.mkdir(exist_ok=True)
          db.init_db()
          db.create_user(987654321, "+243000000000", "Compte fictif")
          PY
      - name: Import into isolated local PostgreSQL
        run: |
          python scripts/postgres_trial.py \
            --source backups/nexis-trial-synthetic.db \
            --schema nexis_trial_${{ github.run_id }}_${{ github.run_attempt }} \
            --apply
