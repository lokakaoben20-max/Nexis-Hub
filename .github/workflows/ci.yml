# Intégration continue de Nexis Hub.
#
# À chaque push et à chaque PR : contrôles du code, toute la suite de tests
# sur un vrai Postgres 16 et Redis 7 (comme en production) puis sur SQLite
# (comme sur le PC de développement), et vérification des migrations.
# Une PR ne doit être fusionnée que si tout est vert (protection de branche
# à activer dans GitHub : Settings > Branches).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  controles:
    name: Contrôles du code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pour la recherche de secrets
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les dépendances (versions figées, empreintes vérifiées)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Erreurs de code (ruff)
        run: ruff check .
      - name: Failles connues dans les dépendances
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
      - name: Aucun secret dans l'historique (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  tests:
    name: Tests (${{ matrix.base }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexis
          POSTGRES_PASSWORD: nexis-ci-seulement
          POSTGRES_DB: nexis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexis -d nexis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXIS_TEST_BACKEND_DB: ${{ matrix.base }}
      # Base d'administration jetable : les tests y créent une base par test.
      NEXIS_TEST_POSTGRES_URL: postgresql+psycopg://nexis:nexis-ci-seulement@localhost:5432/nexis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Suite complète
        # Aucun test ne doit être sauté en CI : -rs affiche la raison de
        # chaque test sauté, et l'étape suivante échoue s'il y en a.
        run: python -m pytest -q -p no:cacheprovider -rs --junitxml=resultats.xml
      - name: Aucun test sauté
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("resultats.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped"))
          print(f"tests sautés : {skipped}")
          sys.exit(1 if skipped else 0)
          PY

  migrations:
    name: Migrations Alembic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexis
          POSTGRES_PASSWORD: nexis-ci-seulement
          POSTGRES_DB: nexis_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexis -d nexis_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nexis:nexis-ci-seulement@localhost:5432/nexis_migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements.txt
      - name: Une seule tête de migration
        run: |
          heads=$(alembic heads | wc -l)
          alembic heads
          test "$heads" -eq 1
      - name: Base vide jusqu'à la dernière version (comme une première mise en production)
        run: alembic upgrade head
      - name: Le modèle et les migrations concordent
        run: alembic check
      - name: Relancer la migration ne change rien
        run: alembic upgrade head && alembic check

  image:
    name: Image Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexis
          POSTGRES_PASSWORD: nexis-ci-seulement
          POSTGRES_DB: nexis_image
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexis -d nexis_image"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire l'image
        run: docker build -t nexis:ci .
      - name: Le processus ne tourne pas en root et ne peut pas écrire dans le code
        run: |
          test "$(docker run --rm --entrypoint id nexis:ci -u)" = "10001"
          if docker run --rm --entrypoint sh nexis:ci -c 'touch /app/essai'; then exit 1; fi
      - name: Un rôle inconnu est refusé
        run: |
          set +e
          docker run --rm nexis:ci inconnu
          test $? -eq 64
      - name: Migration puis backend prêt, en configuration de production
        env:
          DATABASE_URL: postgresql+psycopg://nexis:nexis-ci-seulement@localhost:5432/nexis_image
        run: |
          cat > prod.env <<CONF
          DATABASE_URL=${DATABASE_URL}
          BACKEND_API_KEY_TELEGRAM=$(openssl rand -hex 32)
          APP_CODE_HMAC_KEY=$(openssl rand -hex 32)
          BOT_TOKEN=123456:jeton-factice-de-la-ci
          ADMIN_TELEGRAM_ID=42
          PAYMENT_GATEWAY=flexpay
          COLLECTION_FEE_RATE=0.025
          PAYOUT_FEE_RATE=0
          PAYOUT_FEE_FIXED_USD=0
          PAYOUT_FEE_FIXED_CDF=0
          PAYOUT_MINIMUM_USD=5
          PAYOUT_MINIMUM_CDF=10000
          PAYOUT_AUTO_LIMIT_USD=0
          PAYOUT_AUTO_LIMIT_CDF=0
          PORT=8000
          CONF
          # Sans configuration, le backend refuse de démarrer.
          if docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" nexis:ci backend; then exit 1; fi
          docker run --rm --network host --env-file prod.env nexis:ci migration
          docker run --rm --network host --env-file prod.env nexis:ci controle-registre
          docker run -d --name backend --network host --env-file prod.env nexis:ci backend
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health/ready; then break; fi
            sleep 1
          done
          curl -sf localhost:8000/health/ready
          docker stop -t 10 backend
          docker logs backend | tail -n 5
